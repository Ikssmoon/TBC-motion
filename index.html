/* Layout: hero + sticky filter bar; guide sections with a 4-up card grid (2-up tablet, 1-up phone); lightbox for a large preview */
:root{
  --bg:#f3f6f7; --surface:#ffffff; --raised:#ffffff; --ink:#141719; --muted:#5f6b70; --faint:#8a9599; --line:#e2e8ea; --soft:#edf1f2;
  --accent:#00adee; --accent-ink:#0079ab; --accent-soft:#e2f5fd; --stage-l:#f6f8f8; --stage-d:#434d52;
  --shadow:0 1px 2px rgba(16,32,40,.05),0 6px 20px rgba(16,32,40,.06);
  --body:"Onest",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0e1315; --surface:#161e21; --raised:#1c2629; --ink:#eef3f4; --muted:#9aa8ad; --faint:#6f7e83; --line:#253238; --soft:#1d282c;
  --accent:#2fc0f5; --accent-ink:#5fd0f8; --accent-soft:#11303b; --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25); color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0e1315; --surface:#161e21; --raised:#1c2629; --ink:#eef3f4; --muted:#9aa8ad; --faint:#6f7e83; --line:#253238; --soft:#1d282c;
  --accent:#2fc0f5; --accent-ink:#5fd0f8; --accent-soft:#11303b; --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25); color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
.pad{padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px))}
.wrap{max-width:1200px;margin:0 auto}
button{font:inherit;color:inherit}
button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
svg{flex:none}

/* hero */
.hero{padding-block:36px 26px}
.hero .wrap{display:flex;flex-wrap:wrap;gap:22px 32px;align-items:flex-end;justify-content:space-between}
.eyebrow{display:inline-flex;align-items:center;gap:8px;font-family:var(--mono);font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.eyebrow i{width:8px;height:8px;border-radius:50%;background:var(--accent)}
h1{font-size:clamp(28px,4.4vw,40px);font-weight:700;letter-spacing:-.02em;line-height:1.08;margin:10px 0 10px;text-wrap:balance}
.lede{margin:0;color:var(--muted);max-width:56ch}
.stats{display:flex;gap:26px;margin-top:18px;flex-wrap:wrap}
.stat b{display:block;font-size:20px;font-weight:600;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.stat span{font-size:12.5px;color:var(--muted)}

/* buttons */
.btn{border:0;border-radius:12px;padding:11px 16px;cursor:pointer;display:inline-flex;gap:8px;align-items:center;justify-content:center;font-weight:600;font-size:14px;background:var(--accent);color:#fff;white-space:nowrap;transition:filter .15s,transform .15s}
.btn:hover{filter:brightness(1.06)}.btn:active{transform:translateY(1px)}
.btn.sub{background:var(--soft);color:var(--ink)}
.btn.sub:hover{filter:none;background:var(--accent-soft);color:var(--accent-ink)}
.btn svg{width:16px;height:16px}
.btn[disabled]{opacity:.55;pointer-events:none}

/* menu */
.menu{position:relative}
.pop{position:absolute;right:0;top:calc(100% + 8px);background:var(--raised);border:1px solid var(--line);border-radius:14px;padding:6px;min-width:250px;box-shadow:var(--shadow),0 18px 40px rgba(0,0,0,.12);z-index:40}
.pop .h{padding:8px 10px 6px;font-size:12px;color:var(--faint);font-family:var(--mono);letter-spacing:.04em;text-transform:uppercase}
.pop button{display:flex;width:100%;align-items:center;gap:12px;border:0;background:transparent;padding:10px;border-radius:10px;cursor:pointer;text-align:left}
.pop button:hover,.pop button:focus-visible{background:var(--soft)}
.pop .ico{width:32px;height:32px;border-radius:9px;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent-ink);font-family:var(--mono);font-size:10.5px;font-weight:600}
.pop .txt{flex:1;display:grid}
.pop .txt b{font-weight:600;font-size:14px}
.pop .txt small{font-size:12px;color:var(--muted)}

/* toolbar */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:color-mix(in srgb,var(--bg) 86%,transparent);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border-block:1px solid var(--line)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:31;background:var(--bg)}
.bar .wrap{display:flex;flex-wrap:wrap;gap:10px 14px;align-items:center;justify-content:space-between;padding-block:10px}
.group{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.seg{display:inline-flex;background:var(--soft);border-radius:11px;padding:3px;gap:2px}
.seg button{border:0;background:transparent;color:var(--muted);padding:7px 13px;border-radius:9px;cursor:pointer;font-weight:600;font-size:13px;display:inline-flex;gap:6px;align-items:center}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.1)}
.seg svg{width:14px;height:14px}
.seg .sw{width:9px;height:9px;border-radius:50%;display:inline-block;box-shadow:0 0 0 1.5px var(--surface)}
.seg .n{font-family:var(--mono);font-size:11px;color:var(--faint);font-weight:500}
.lbl{font-size:12px;color:var(--faint);font-family:var(--mono);letter-spacing:.04em;text-transform:uppercase}

/* sections */
main{padding-block:28px 64px}
section.guide{margin-bottom:44px}
section.guide[hidden]{display:none}
.ghead{display:flex;flex-wrap:wrap;gap:12px 18px;align-items:flex-end;justify-content:space-between;margin-bottom:16px}
.ghead h2{font-size:21px;font-weight:650;margin:0;letter-spacing:-.01em;display:flex;align-items:center;gap:10px}
.ghead h2 .cnt{font-family:var(--mono);font-size:12px;font-weight:500;color:var(--muted);background:var(--soft);border-radius:999px;padding:2px 9px}
.ghead p{margin:4px 0 0;color:var(--muted);font-size:14px}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px}
@media (max-width:560px){.grid{grid-template-columns:minmax(0,1fr)}}

/* card */
.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;overflow:hidden;display:flex;flex-direction:column;min-width:0;box-shadow:var(--shadow);transition:transform .2s,box-shadow .2s}
.card:hover{transform:translateY(-2px)}
.stage{position:relative;aspect-ratio:581/411;background:var(--stage-l);cursor:zoom-in;border:0;padding:0;width:100%;display:block;overflow:hidden;transition:background-color .25s}
.dark .stage{background:var(--stage-d)}
.stage video{position:absolute;inset:0;width:100%;height:100%;object-fit:contain}
.stage .zoom{position:absolute;right:10px;bottom:10px;width:30px;height:30px;border-radius:9px;background:rgba(20,23,25,.55);color:#fff;display:grid;place-items:center;opacity:0;transition:opacity .2s}
.stage:hover .zoom,.stage:focus-visible .zoom{opacity:1}
.stage .zoom svg{width:15px;height:15px}
.info{padding:14px 14px 4px;display:grid;gap:4px}
.info h3{font-size:15.5px;font-weight:600;margin:0;letter-spacing:-.005em}
.tags{display:flex;flex-wrap:wrap;gap:6px;font-size:12px;color:var(--muted)}
.tags span{display:inline-flex;align-items:center;gap:5px}
.tags span+span::before{content:"";width:3px;height:3px;border-radius:50%;background:var(--faint);margin-right:1px}
.acts{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:12px 14px 14px;margin-top:auto}
.fbtn{border:1px solid var(--line);background:transparent;border-radius:12px;padding:9px 10px;cursor:pointer;display:flex;align-items:center;gap:9px;text-align:left;transition:border-color .15s,background .15s;min-width:0}
.fbtn:hover{border-color:var(--accent);background:var(--accent-soft)}
.fbtn .ic{width:28px;height:28px;border-radius:8px;display:grid;place-items:center;background:var(--soft);color:var(--ink);flex:none}
.fbtn:hover .ic{background:var(--surface);color:var(--accent-ink)}
.fbtn .ic svg{width:15px;height:15px}
.fbtn .t{display:grid;line-height:1.2;min-width:0}
.fbtn b{font-size:13px;font-weight:600}
.fbtn small{font-family:var(--mono);font-size:11px;color:var(--muted)}
.fbtn[disabled]{opacity:.55;pointer-events:none}

/* lightbox */
.lb{position:fixed;inset:0;z-index:60;background:rgba(8,12,14,.72);display:grid;place-items:center;padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.lb[hidden]{display:none}
.lbbox{background:var(--surface);border-radius:20px;overflow:hidden;width:min(880px,100%);max-height:100%;display:flex;flex-direction:column;box-shadow:0 30px 80px rgba(0,0,0,.4)}
.lbstage{aspect-ratio:581/411;background:var(--stage-l);position:relative;max-height:68vh}
.lb.dark .lbstage{background:var(--stage-d)}
.lbstage video{position:absolute;inset:0;width:100%;height:100%;object-fit:contain}
.lbfoot{display:flex;flex-wrap:wrap;gap:12px 16px;align-items:center;justify-content:space-between;padding:16px 18px}
.lbfoot h3{margin:0;font-size:18px;font-weight:600}
.lbfoot .acts{padding:0;display:flex;gap:8px}
.x{position:absolute;top:12px;right:12px;width:36px;height:36px;border-radius:50%;border:0;background:rgba(20,23,25,.55);color:#fff;cursor:pointer;display:grid;place-items:center}
.x svg{width:16px;height:16px}

/* progress toast */
.toast{position:fixed;left:50%;bottom:calc(22px + env(safe-area-inset-bottom,0px));transform:translate(-50%,12px);background:var(--ink);color:var(--bg);padding:12px 16px;border-radius:14px;font-size:13.5px;font-weight:500;z-index:70;opacity:0;transition:opacity .2s,transform .2s;pointer-events:none;width:min(360px,calc(100% - 32px));display:grid;gap:8px}
.toast.show{opacity:1;transform:translate(-50%,0)}
.toast .pb{height:4px;border-radius:4px;background:color-mix(in srgb,var(--bg) 25%,transparent);overflow:hidden}
.toast .pb i{display:block;height:100%;width:0;background:var(--accent);transition:width .15s}
.toast .pb[hidden]{display:none}
@media (max-width:640px){
  .hero{padding-block:26px 20px}
  .stats{display:grid;grid-template-columns:repeat(3,auto);gap:14px;justify-content:start}
  .stat b{font-size:17px}.stat span{font-size:11.5px}
  .hero .menu,.hero .menu .btn{width:100%}
  .bar{position:static}
  .lbl{display:none}
  .ghead .menu{width:100%}.ghead .menu .btn{width:100%}
  .pop{left:0;right:0;min-width:0}
}
@media (prefers-reduced-motion: reduce){.card,.btn,.toast{transition:none}}
</style>

  const variants = (g, it) => (g.langs ? ['en', 'ka'] : ['en']).flatMap(l => (it && it.lightOnly ? ['light'] : ['light', 'dark']).map(m => [l, m]));
  const inStyle = (it, st = S.style) => !it.styles || it.styles.includes(st);
  const files = (gs, fmts, sts = [S.style]) => sts.flatMap(st => gs.flatMap(g => g.items.filter(it => inStyle(it, st)).flatMap(it => variants(g, it).flatMap(([l, m]) => fmts.map(f => ({ g, st, p: path(g, it, l, m, f, st), f }))))));
  const total = list => list.reduce((a, x) => a + (SIZES[x.p] || 0), 0);
  const fmtsOf = k => k === 'both' ? ['mp4', 'lottie'] : [k];

  const S = { style: 'mass', lang: 'en', mode: 'light', filter: 'all' };
  let dl = null;

  // ---------- stats + filter ----------
  const allFiles = files(GUIDES, ['mp4', 'lottie']);
  document.getElementById('stats').innerHTML =
    `<div class="stat"><b>${GUIDES.reduce((a, g) => a + g.items.length, 0)}</b><span>animations</span></div>
     <div class="stat"><b>3</b><span>styles · Mass, Concept, Wealth</span></div>
     <div class="stat"><b>${files(GUIDES, ['mp4'], Object.keys(STYLES)).length}</b><span>videos, each also as Lottie</span></div>
     <div class="stat"><b>${size(total(files(GUIDES, ['mp4', 'lottie'], Object.keys(STYLES))))}</b><span>in total</span></div>`;
  const fseg = document.getElementById('filterSeg');
  fseg.innerHTML = [['all', 'All', GUIDES.reduce((a, g) => a + g.items.length, 0)], ...GUIDES.map(g => [g.key, g.name.replace(' guide', ''), g.items.length])]
    .map(([k, n, c]) => `<button type="button" data-v="${k}" aria-pressed="${k === 'all'}">${n}<span class="n">${c}</span></button>`).join('');

  // ---------- sections ----------
  const root = document.getElementById('guides'), updaters = [], sections = {};
  GUIDES.forEach(g => {
    const s = document.createElement('section'); s.className = 'guide'; sections[g.key] = s;
    s.innerHTML = `<div class="ghead"><div><h2>${g.name}<span class="cnt">${g.items.length} animations</span></h2><p>${g.desc}${g.langs ? ' · English and Georgian' : ''}</p></div>
      <div class="menu"><button type="button" class="btn sub" aria-haspopup="true" aria-expanded="false">${ICON_DL}Download all<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m4.5 6.5 3.5 3.5 3.5-3.5"/></svg></button><div class="pop" hidden></div></div></div>
      <div class="grid"></div>`;
    setupMenu(s.querySelector('.menu'), g.name, [g]);
    const grid = s.querySelector('.grid');
    g.items.forEach(it => {
      const c = document.createElement('article'); c.className = 'card';
      c.innerHTML = `<button type="button" class="stage" aria-label="Open larger preview of ${it.title}"><video muted loop playsinline autoplay preload="auto"></video><span class="zoom">${'<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9.5 2.5h4v4M6.5 13.5h-4v-4M13.5 2.5 9 7M2.5 13.5 7 9"/></svg>'}</span></button>
        <div class="info"><h3>${it.title}</h3><div class="tags"></div></div>
        <div class="acts"></div>`;
      const v = c.querySelector('video'), tags = c.querySelector('.tags'), acts = c.querySelector('.acts');
      const upd = () => {
        c.hidden = !inStyle(it);
        const src = path(g, it, S.lang, S.mode, 'mp4');
        if (v.getAttribute('src') !== src) { v.setAttribute('src', src); v.play?.().catch(() => {}); }
        c.classList.toggle('dark', S.mode === 'dark');
        tags.innerHTML = [STYLES[S.style], it.tag, g.langs ? (S.lang === 'ka' ? 'Georgian' : 'English') : null, it.lightOnly ? 'Light only' : S.mode === 'dark' ? 'Dark' : 'Light', (DUR[src] || 0).toFixed(1) + ' s'].filter(Boolean).map(t => `<span>${t}</span>`).join('');
        acts.innerHTML = ''; fileButtons(g, it).forEach(b => acts.appendChild(b));
      };
      c.querySelector('.stage').onclick = () => openLb(g, it);
      grid.appendChild(c); updaters.push(upd); upd();
    });
    const cnt = () => { s.querySelector('.cnt').textContent = `${g.items.filter(it => inStyle(it)).length} animations`; };
    updaters.push(cnt); cnt();
    root.appendChild(s);
  });
  setupMenu(document.getElementById('allMenu'), 'All guides', GUIDES);

  function fileButtons(g, it) {
    return ['mp4', 'lottie'].map(f => {
      const p = path(g, it, S.lang, S.mode, f), b = document.createElement('button');
      b.type = 'button'; b.className = 'fbtn'; b.title = `Download ${p.split('/').pop()}`;
      b.innerHTML = `<span class="ic">${f === 'mp4' ? ICON_VID : ICON_LOT}</span><span class="t"><b>${FMT[f].label}</b><small>${size(SIZES[p] || 0)}</small></span>`;
      b.onclick = async () => { b.disabled = true; try { await saveOne(p); } catch (e) { report(e); } b.disabled = false; };
      return b;
    });
  }

  // ---------- controls ----------
  const bindSeg = (id, key, after) => { const seg = document.getElementById(id);
    seg.querySelectorAll('button').forEach(b => b.onclick = () => { S[key] = b.dataset.v; seg.querySelectorAll('button').forEach(x => x.setAttribute('aria-pressed', String(x === b))); after(); }); };
  const refresh = () => { updaters.forEach(u => u()); if (!lb.hidden && lbCur) openLb(...lbCur); };
  bindSeg('langSeg', 'lang', refresh);
  bindSeg('modeSeg', 'mode', refresh);
  bindSeg('styleSeg', 'style', refresh);
  bindSeg('filterSeg', 'filter', () => { GUIDES.forEach(g => sections[g.key].hidden = S.filter !== 'all' && S.filter !== g.key); });

  // ---------- menus ----------
  function setupMenu(menu, heading, gs) {
    const btn = menu.querySelector('button'), pop = menu.querySelector('.pop');
    const build = () => {
      pop.innerHTML = '';
      const sec = (title, opts) => {
        const h = document.createElement('div'); h.className = 'h'; h.textContent = title; pop.appendChild(h);
        opts.forEach(([k, label, ico, sts]) => {
          const list = files(gs, fmtsOf(k), sts), b = document.createElement('button'); b.type = 'button';
          b.innerHTML = `<span class="ico">${ico}</span><span class="txt"><b>${label}</b><small>${list.length} files · ${size(total(list))}</small></span>`;
          b.onclick = async () => { close(); btn.disabled = true; try { await saveZip(gs, k, sts); } catch (e) { report(e); } btn.disabled = false; };
          pop.appendChild(b);
        });
      };
      const cur = [S.style], all = Object.keys(STYLES);
      sec(`${heading} · ${STYLES[S.style]}`, [['mp4', 'All MP4', 'MP4', cur], ['lottie', 'All Lottie', 'JSON', cur], ['both', 'MP4 + Lottie', 'ALL', cur]]);
      sec(`${heading} · all 3 styles`, [['mp4', 'MP4, every style', 'MP4', all], ['lottie', 'Lottie, every style', 'JSON', all]]);
    };
    const close = () => { pop.hidden = true; btn.setAttribute('aria-expanded', 'false'); };
    btn.onclick = e => { e.stopPropagation(); const open = pop.hidden; document.querySelectorAll('.pop').forEach(p => p.hidden = true); document.querySelectorAll('[aria-haspopup]').forEach(x => x.setAttribute('aria-expanded', 'false')); if (open) build(); pop.hidden = !open; btn.setAttribute('aria-expanded', String(open)); };
    document.addEventListener('click', e => { if (!menu.contains(e.target)) close(); });
    document.addEventListener('keydown', e => { if (e.key === 'Escape') close(); });
  }

  // ---------- lightbox ----------
  const lb = document.getElementById('lb'), lbv = lb.querySelector('video'); let lbCur = null, lastFocus = null;
  function openLb(g, it) {
    if (!inStyle(it)) { closeLb(); return; }
    lbCur = [g, it]; if (lb.hidden) lastFocus = document.activeElement;
    const src = path(g, it, S.lang, S.mode, 'mp4');
    if (lbv.getAttribute('src') !== src) { lbv.setAttribute('src', src); lbv.play?.().catch(() => {}); }
    lb.classList.toggle('dark', S.mode === 'dark');
    document.getElementById('lbTitle').textContent = it.title;
    document.getElementById('lbTags').innerHTML = [g.name, STYLES[S.style], it.tag, g.langs ? (S.lang === 'ka' ? 'Georgian' : 'English') : null, it.lightOnly ? 'Light only' : S.mode === 'dark' ? 'Dark' : 'Light', (DUR[src] || 0).toFixed(1) + ' s'].filter(Boolean).map(t => `<span>${t}</span>`).join('');
    const a = document.getElementById('lbActs'); a.innerHTML = ''; fileButtons(g, it).forEach(b => a.appendChild(b));
    lb.hidden = false; document.getElementById('lbClose').focus();
  }
  const closeLb = () => { lb.hidden = true; lbv.pause(); lbCur = null; lastFocus?.focus?.(); };
  document.getElementById('lbClose').onclick = closeLb;
  lb.addEventListener('click', e => { if (e.target === lb) closeLb(); });
  document.addEventListener('keydown', e => { if (e.key === 'Escape' && !lb.hidden) closeLb(); });

  // ---------- toast ----------
  const toastEl = document.getElementById('toast'), tMsg = document.getElementById('toastMsg'), pb = toastEl.querySelector('.pb'), pbi = pb.querySelector('i'); let tt;
  const toast = (msg, prog) => { tMsg.textContent = msg; pb.hidden = prog == null; if (prog != null) pbi.style.width = (prog * 100) + '%';
    toastEl.classList.add('show'); clearTimeout(tt); if (prog == null) tt = setTimeout(() => toastEl.classList.remove('show'), 2800); };

  // ---------- downloads ----------
  async function save(filename, blob) {
    if (!dl) {
      const url = URL.createObjectURL(blob), a = document.createElement('a');
      a.href = url; a.download = filename; document.body.appendChild(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 60000);
      toast(`Downloading ${filename}`); return;
    }
    const r = await dl.save({ filename, data: blob });
    if (r.status === 'saved') toast(`Saved ${filename}`);
  }
  async function saveOne(p) { const blob = await (await fetch(p)).blob(); await save(p.split('/').pop(), blob); }
  async function saveZip(gs, k, sts = [S.style]) {
    const label = { mp4: 'MP4', lottie: 'Lottie', both: 'MP4 + Lottie' }[k] + (sts.length > 1 ? ', all styles' : ` (${STYLES[sts[0]]})`);
    const name = gs.length > 1 ? 'TBC guide animations' : gs[0].name;
    const list = files(gs, fmtsOf(k), sts), zip = new JSZip(); let done = 0;
    toast(`Collecting ${list.length} files…`, 0);
    for (let i = 0; i < list.length; i += 6) {
      await Promise.all(list.slice(i, i + 6).map(async x => {
        const blob = await (await fetch(x.p)).blob();
        zip.file(`${name}/${STYLES[x.st]}/${gs.length > 1 ? x.g.name + '/' : ''}${FMT[x.f].label}/${x.p.split('/').pop()}`, blob);
        done++; toast(`Collecting files… ${done} / ${list.length}`, done / list.length * .9);
      }));
    }
    toast('Packing zip…', .95);
    const out = await zip.generateAsync({ type: 'blob', compression: 'STORE' });
    toastEl.classList.remove('show');
    await save(`${name} - ${label}.zip`, out);
  }
  function report(err) {
    const c = err && err.code;
    if (c === 'declined') return toast('Download cancelled');
    if (c === 'rate_limited') return toast('A save prompt is already open');
    if (c === 'too_large') return toast('Too large for this device. Try one guide at a time.');
    toast('Could not save the file. Try again.');
  }
  if (window.claude?.use) claude.use('downloads').then(ns => { dl = ns; }).catch(() => {});
})();
</script>
